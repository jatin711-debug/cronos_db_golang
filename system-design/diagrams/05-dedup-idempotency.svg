<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Idempotent publish — two-tier dedup and the three states of a message_id</title>
  <desc id="desc">An incoming message ID is first checked against an in-memory bloom filter. Definitely new IDs are claimed without a disk read; possibly seen IDs are looked up in the exact Pebble store. A known ID is in one of three states: claimed while a publish is in flight, appended once it is in the log, accepted once it is replicated and scheduled. A retry is answered according to that state.</desc>
  <defs>
    <marker id="ah-57606a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.9 L9.6 5 L0 9.1 z" fill="#57606a"/></marker>
    <marker id="ah-cf3a30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.9 L9.6 5 L0 9.1 z" fill="#cf3a30"/></marker>
  </defs>

  <!-- card: the diagram brings its own background so it reads on light and dark pages -->
  <rect x="0.5" y="0.5" width="999" height="631" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="37" font-size="20" font-weight="700" fill="#1f2328">Idempotent publish — two-tier dedup and the three states of a message_id</text>
  <text x="28" y="58" font-size="12.5" fill="#57606a">A producer may retry a publish as often as it likes; the same message_id must never become two events.</text>

  <!-- left: is the ID new? -->
  <rect x="24" y="76" width="576" height="386" rx="12" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.2" stroke-dasharray="5 4" fill-opacity="0.28"/>
  <text x="38" y="94" font-size="10.5" fill="#0b3a7e" font-weight="700" letter-spacing="0.04em">IS THIS message_id NEW?</text>
  <rect x="40" y="124" width="100" height="50" rx="8" fill="#f4f5f7" stroke="#8b949e" stroke-width="1.3"/>
  <text x="90" y="153" font-size="11.3" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">message_id</text>
  <rect x="176" y="112" width="160" height="74" rx="8" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.3"/>
  <text x="256" y="137.8" font-size="13.5" fill="#0b3a7e" text-anchor="middle" font-weight="600">Bloom filter</text>
  <text x="256" y="155.7" font-size="10.8" fill="#57606a" text-anchor="middle">in RAM · 10 bits per ID</text>
  <text x="256" y="170.2" font-size="10.8" fill="#57606a" text-anchor="middle">answers without I/O</text>
  <rect x="426" y="112" width="160" height="74" rx="8" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.3"/>
  <text x="506" y="137.8" font-size="13.5" fill="#145232" text-anchor="middle" font-weight="600">Pebble</text>
  <text x="506" y="155.7" font-size="10.8" fill="#57606a" text-anchor="middle">LSM tree on disk · exact</text>
  <text x="506" y="170.2" font-size="10.8" fill="#57606a" text-anchor="middle">ID → state · TTL 7 days</text>
  <rect x="176" y="262" width="160" height="74" rx="8" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.3"/>
  <text x="256" y="287.8" font-size="13.5" fill="#145232" text-anchor="middle" font-weight="600">Claim it</text>
  <text x="256" y="305.7" font-size="10.8" fill="#1f2328" text-anchor="middle">write CLAIMED to Pebble,</text>
  <text x="256" y="320.2" font-size="10.8" fill="#1f2328" text-anchor="middle">set the bits in the bloom</text>
  <rect x="426" y="262" width="160" height="74" rx="8" fill="#f4f5f7" stroke="#8b949e" stroke-width="1.3"/>
  <text x="506" y="287.8" font-size="13.5" fill="#24292f" text-anchor="middle" font-weight="600">Known ID</text>
  <text x="506" y="305.7" font-size="10.8" fill="#1f2328" text-anchor="middle">its state decides the</text>
  <text x="506" y="320.2" font-size="10.8" fill="#1f2328" text-anchor="middle">answer  →</text>
  <path d="M140 149 L174.6 149" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <path d="M336 149 L424.6 149" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <text x="380.3" y="143" font-size="10.8" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#f3f8fe" stroke-width="4" stroke-linejoin="round">“maybe seen”</text>
  <path d="M236 186 L236 260.6" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <text x="228" y="220" font-size="10.8" fill="#1f2328" text-anchor="end">“definitely new”</text>
  <text x="228" y="234" font-size="10.3" fill="#57606a" text-anchor="end">no disk read</text>
  <path d="M530 186 L530 260.6" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <text x="538" y="228" font-size="10.8" fill="#1f2328" paint-order="stroke" stroke="#f3f8fe" stroke-width="4" stroke-linejoin="round">found</text>
  <path d="M456 186 L456 232 L300 232 L300 260.6" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <text x="378" y="212" font-size="10.3" fill="#57606a" text-anchor="middle">not found: it was a</text>
  <text x="378" y="225" font-size="10.3" fill="#57606a" text-anchor="middle">false positive (&lt; 1 %)</text>
  <text x="44" y="368" font-size="11.3" fill="#1f2328">A bloom filter has no false negatives: “definitely new” is always right and needs no confirmation.</text>
  <text x="44" y="384" font-size="11.3" fill="#1f2328">“Maybe seen” can be wrong, so it is always confirmed in the exact store.</text>
  <text x="44" y="416" font-size="11.3" fill="#57606a">A batch does this once for all its IDs, and claims are striped by ID so two publishes of the same ID</text>
  <text x="44" y="432" font-size="11.3" fill="#57606a">cannot both win.</text>

  <!-- right: state machine -->
  <rect x="612" y="76" width="364" height="386" rx="12" fill="#f2ecfd" stroke="#7c4ddb" stroke-width="1.2" stroke-dasharray="5 4" fill-opacity="0.28"/>
  <text x="626" y="94" font-size="10.5" fill="#3d1f85" font-weight="700" letter-spacing="0.04em">THE STATES OF A KNOWN message_id</text>
  <rect x="662" y="104" width="154" height="46" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="739" y="124" font-size="12.5" fill="#24292f" text-anchor="middle" font-weight="600">unknown</text>
  <text x="739" y="139.1" font-size="10.3" fill="#57606a" text-anchor="middle">never seen, or forgotten</text>
  <line x1="816" y1="127" x2="828" y2="127" stroke="#afb8c1" stroke-width="1"/>
  <text x="832" y="123" font-size="10.3" fill="#57606a">a publish proceeds</text>
  <text x="832" y="136" font-size="10.3" fill="#1f2328" font-weight="600">as new</text>
  <path d="M739 150 L739 182.6" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <text x="747" y="171" font-size="10.3" fill="#1f2328" paint-order="stroke" stroke="#f8f4fe" stroke-width="4" stroke-linejoin="round">claim</text>
  <rect x="662" y="184" width="154" height="46" rx="8" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.3"/>
  <text x="739" y="204" font-size="12.5" fill="#0b3a7e" text-anchor="middle" font-weight="600">CLAIMED</text>
  <text x="739" y="219.1" font-size="10.3" fill="#57606a" text-anchor="middle">a publish is in flight</text>
  <line x1="816" y1="207" x2="828" y2="207" stroke="#afb8c1" stroke-width="1"/>
  <text x="832" y="203" font-size="10.3" fill="#57606a">a retry is told:</text>
  <text x="832" y="216" font-size="10.3" fill="#1f2328" font-weight="600">“still in progress”</text>
  <path d="M739 230 L739 262.6" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <text x="747" y="251" font-size="10.3" fill="#1f2328" paint-order="stroke" stroke="#f8f4fe" stroke-width="4" stroke-linejoin="round">log append ok</text>
  <rect x="662" y="264" width="154" height="46" rx="8" fill="#fff4d9" stroke="#c98a00" stroke-width="1.3"/>
  <text x="739" y="284" font-size="12.5" fill="#6b4700" text-anchor="middle" font-weight="600">APPENDED @ N</text>
  <text x="739" y="299.1" font-size="10.3" fill="#57606a" text-anchor="middle">in the log, not yet promised</text>
  <line x1="816" y1="287" x2="828" y2="287" stroke="#afb8c1" stroke-width="1"/>
  <text x="832" y="283" font-size="10.3" fill="#57606a">a retry finishes that</text>
  <text x="832" y="296" font-size="10.3" fill="#1f2328" font-weight="600">publish: same offset</text>
  <path d="M739 310 L739 342.6" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <text x="747" y="331" font-size="10.3" fill="#1f2328" paint-order="stroke" stroke="#f8f4fe" stroke-width="4" stroke-linejoin="round">quorum reached, timer armed</text>
  <rect x="662" y="344" width="154" height="46" rx="8" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.3"/>
  <text x="739" y="364" font-size="12.5" fill="#145232" text-anchor="middle" font-weight="600">ACCEPTED @ N</text>
  <text x="739" y="379.1" font-size="10.3" fill="#57606a" text-anchor="middle">replicated and scheduled</text>
  <line x1="816" y1="367" x2="828" y2="367" stroke="#afb8c1" stroke-width="1"/>
  <text x="832" y="363" font-size="10.3" fill="#57606a">a retry is told:</text>
  <text x="832" y="376" font-size="10.3" fill="#1f2328" font-weight="600">“duplicate message_id”</text>
  <path d="M662 207 L646 207 L646 133 L660.6 133" fill="none" stroke="#cf3a30" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah-cf3a30)"/>
  <path d="M662 287 L632 287 L632 121 L660.6 121" fill="none" stroke="#cf3a30" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah-cf3a30)"/>
  <text x="628" y="420" font-size="10.5" fill="#cf3a30" font-weight="600">back to unknown (red):</text>
  <text x="628" y="435" font-size="10.3" fill="#1f2328">CLAIMED: the log append failed, the claim is rolled back</text>
  <text x="628" y="449" font-size="10.3" fill="#1f2328">APPENDED: a new leader replaced that part of the log</text>
  <rect x="24" y="480" width="470" height="136" rx="8" fill="#fffbe8" stroke="#d9bf50" stroke-width="1.2"/>
  <text x="37" y="503" font-size="12.5" fill="#4d3f00" font-weight="700">Why two tiers?</text>
  <text x="37" y="525.9" font-size="11.3" fill="#1f2328">The exact store alone would mean a disk lookup for every publish. The bloom filter</text>
  <text x="37" y="542" font-size="11.3" fill="#1f2328">answers “definitely new” from memory, so only the rare “maybe” reads from disk.</text>
  <text x="37" y="562" font-size="11.3" fill="#1f2328">Cost: about 120 MB of RAM per partition at the default capacity of 100 million IDs</text>
  <text x="37" y="578" font-size="11.3" fill="#1f2328">(allocated on first use), and IDs are forgotten after the TTL — dedup is a 7-day</text>
  <text x="37" y="594.1" font-size="11.3" fill="#1f2328">window, not forever.</text>
  <rect x="506" y="480" width="470" height="136" rx="8" fill="#fffbe8" stroke="#d9bf50" stroke-width="1.2"/>
  <text x="519" y="503" font-size="12.5" fill="#4d3f00" font-weight="700">Why three states, and not just seen / not seen?</text>
  <text x="519" y="525.9" font-size="11.3" fill="#1f2328">A publish can fail after its event is in the log: no quorum, or a failed sync. Forget</text>
  <text x="519" y="542" font-size="11.3" fill="#1f2328">the ID, and the retry appends a second copy. Call it done, and the retry is told</text>
  <text x="519" y="558" font-size="11.3" fill="#1f2328">“duplicate” although nobody was promised delivery.</text>
  <text x="519" y="578" font-size="11.3" fill="#1f2328">APPENDED remembers the offset, so a retry completes the first attempt: one</text>
  <text x="519" y="594.1" font-size="11.3" fill="#1f2328">event, one offset, however often the producer retries.</text>
</svg>
