<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Delivery — push with credits, at-least-once, retries and a dead-letter queue</title>
  <desc id="desc">A fired timer goes through the ready queue and worker to the dispatcher, which pushes it over a gRPC stream to a consumer that has credit. Acks come back on a second stream. Missing acks lead to retries with backoff and finally to the dead-letter queue. Progress per consumer group is a floor below which everything is complete, plus individual completion records above it.</desc>
  <defs>
    <marker id="ah-2e8b57" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.9 L9.6 5 L0 9.1 z" fill="#2e8b57"/></marker>
    <marker id="ah-57606a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.9 L9.6 5 L0 9.1 z" fill="#57606a"/></marker>
  </defs>

  <!-- card: the diagram brings its own background so it reads on light and dark pages -->
  <rect x="0.5" y="0.5" width="999" height="659" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="37" font-size="20" font-weight="700" fill="#1f2328">Delivery — push with credits, at-least-once, retries and a dead-letter queue</text>
  <text x="28" y="58" font-size="12.5" fill="#57606a">From the moment a timer fires to the moment a consumer group has finished the event.</text>
  <rect x="26" y="82" width="143" height="54" rx="8" fill="#fff4d9" stroke="#c98a00" stroke-width="1.3"/>
  <text x="97.5" y="105.1" font-size="13.5" fill="#6b4700" text-anchor="middle" font-weight="600">Timer fires</text>
  <text x="97.5" y="122.8" font-size="10.6" fill="#57606a" text-anchor="middle">scheduler</text>
  <rect x="187" y="82" width="143" height="54" rx="8" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.3"/>
  <text x="258.5" y="105.1" font-size="13.5" fill="#0b3a7e" text-anchor="middle" font-weight="600">Ready queue</text>
  <text x="258.5" y="122.8" font-size="10.6" fill="#57606a" text-anchor="middle">bounded</text>
  <path d="M169 109 L185.6 109" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <rect x="348" y="82" width="143" height="54" rx="8" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.3"/>
  <text x="419.5" y="105.1" font-size="13.5" fill="#0b3a7e" text-anchor="middle" font-weight="600">Worker</text>
  <text x="419.5" y="122.8" font-size="10.6" fill="#57606a" text-anchor="middle">drains in batches</text>
  <path d="M330 109 L346.6 109" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <rect x="509" y="82" width="143" height="54" rx="8" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.3"/>
  <text x="580.5" y="105.1" font-size="13.5" fill="#0b3a7e" text-anchor="middle" font-weight="600">Dispatcher</text>
  <text x="580.5" y="122.8" font-size="10.6" fill="#57606a" text-anchor="middle">32 shards · per group</text>
  <path d="M491 109 L507.6 109" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <rect x="670" y="82" width="143" height="54" rx="8" fill="#e4f6f4" stroke="#1f9d94" stroke-width="1.3"/>
  <text x="741.5" y="105.1" font-size="13.5" fill="#0d524d" text-anchor="middle" font-weight="600">gRPC stream</text>
  <text x="741.5" y="122.8" font-size="10.6" fill="#57606a" text-anchor="middle">Subscribe</text>
  <path d="M652 109 L668.6 109" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <rect x="831" y="82" width="143" height="54" rx="8" fill="#e4f6f4" stroke="#1f9d94" stroke-width="1.3"/>
  <text x="902.5" y="105.1" font-size="13.5" fill="#0d524d" text-anchor="middle" font-weight="600">Consumer</text>
  <text x="902.5" y="122.8" font-size="10.6" fill="#57606a" text-anchor="middle">your code</text>
  <path d="M813 109 L829.6 109" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah-57606a)"/>
  <path d="M902 136 L902 164 L580 164 L580 137.4" fill="none" stroke="#2e8b57" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah-2e8b57)"/>
  <text x="741" y="158" font-size="10.8" fill="#145232" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Ack / Nack, on a second stream</text>
  <rect x="24" y="190" width="304" height="136" rx="8" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.2"/>
  <text x="37" y="213" font-size="12.5" fill="#0b3a7e" font-weight="700">Credits: flow control</text>
  <text x="37" y="235.4" font-size="10.9" fill="#1f2328">A subscriber grants credits; each delivery spends one</text>
  <text x="37" y="250.8" font-size="10.9" fill="#1f2328">and each ack returns one. With no credit the event</text>
  <text x="37" y="266.3" font-size="10.9" fill="#1f2328">waits and is re-read from the log later. It is never</text>
  <text x="37" y="281.8" font-size="10.9" fill="#1f2328">dropped, and a slow consumer cannot fill the server’s</text>
  <text x="37" y="297.3" font-size="10.9" fill="#1f2328">memory.</text>
  <rect x="348" y="190" width="304" height="136" rx="8" fill="#fdecea" stroke="#cf3a30" stroke-width="1.2"/>
  <text x="361" y="213" font-size="12.5" fill="#8a1f17" font-weight="700">Retry heap, then the dead-letter queue</text>
  <text x="361" y="235.4" font-size="10.9" fill="#1f2328">No ack within 30 s, or a nack: the delivery goes into a</text>
  <text x="361" y="250.8" font-size="10.9" fill="#1f2328">min-heap ordered by retry time (backoff =</text>
  <text x="361" y="266.3" font-size="10.9" fill="#1f2328">attempt × 1 s). After 5 retries it is written to the</text>
  <text x="361" y="281.8" font-size="10.9" fill="#1f2328">dead-letter queue and counted as complete.</text>
  <rect x="672" y="190" width="304" height="136" rx="8" fill="#f4f5f7" stroke="#8b949e" stroke-width="1.2"/>
  <text x="685" y="213" font-size="12.5" fill="#24292f" font-weight="700">Circuit breaker</text>
  <text x="685" y="235.4" font-size="10.9" fill="#1f2328">Per subscription. At 50 % failures over at least 10</text>
  <text x="685" y="250.8" font-size="10.9" fill="#1f2328">attempts it opens for 30 s, then lets one probe</text>
  <text x="685" y="266.3" font-size="10.9" fill="#1f2328">through. A dead consumer stops soaking up deliveries</text>
  <text x="685" y="281.8" font-size="10.9" fill="#1f2328">that would only time out.</text>

  <!-- progress -->
  <text x="26" y="356" font-size="12.8" fill="#1f2328" font-weight="700">Progress per consumer group: a floor, plus single completions above it</text>
  <rect x="60" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="91" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">100</text>
  <text x="91" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="126" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="157" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">101</text>
  <text x="157" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="192" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="223" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">102</text>
  <text x="223" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="258" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="289" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">103</text>
  <text x="289" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="324" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="355" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">104</text>
  <text x="355" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="390" y="370" width="62" height="42" rx="5" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="421" y="387" font-size="11.3" fill="#24292f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">105</text>
  <text x="421" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">not due</text>
  <rect x="456" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="487" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">106</text>
  <text x="487" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="522" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="553" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">107</text>
  <text x="553" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="588" y="370" width="62" height="42" rx="5" fill="#eaf2fe" stroke="#3b78d8" stroke-width="1.2"/>
  <text x="619" y="387" font-size="11.3" fill="#0b3a7e" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">108</text>
  <text x="619" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">in flight</text>
  <rect x="654" y="370" width="62" height="42" rx="5" fill="#e7f6ed" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="685" y="387" font-size="11.3" fill="#145232" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">109</text>
  <text x="685" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">done</text>
  <rect x="720" y="370" width="62" height="42" rx="5" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="751" y="387" font-size="11.3" fill="#24292f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">110</text>
  <text x="751" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">not due</text>
  <rect x="786" y="370" width="62" height="42" rx="5" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="817" y="387" font-size="11.3" fill="#24292f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace">111</text>
  <text x="817" y="402" font-size="9.6" fill="#57606a" text-anchor="middle">not due</text>
  <line x1="388" y1="362" x2="388" y2="420" stroke="#cf3a30" stroke-width="2.4"/>
  <text x="388" y="436" font-size="11" fill="#cf3a30" text-anchor="middle" font-weight="700">floor = 105</text>
  <text x="340" y="436" font-size="10.6" fill="#57606a" text-anchor="end">everything below it is complete</text>
  <text x="436" y="436" font-size="10.6" fill="#57606a">above it, completion is recorded event by event</text>
  <text x="866" y="387" font-size="10.3" fill="#57606a">offsets of</text>
  <text x="866" y="401" font-size="10.3" fill="#57606a">one partition</text>
  <text x="26" y="462" font-size="11.1" fill="#1f2328">Events come due in schedule order, not offset order (105 is due tomorrow; 106–109 were due today), so a single “committed offset” would either skip 105 or redeliver the others.</text>
  <text x="26" y="477.8" font-size="11.1" fill="#1f2328">The leader also copies this progress to its followers, so a failover does not redeliver finished work.</text>
  <rect x="24" y="510" width="304" height="134" rx="8" fill="#fffbe8" stroke="#d9bf50" stroke-width="1.2"/>
  <text x="37" y="533" font-size="12.5" fill="#4d3f00" font-weight="700">Push, not pull</text>
  <text x="37" y="555.4" font-size="10.9" fill="#1f2328">A consumer cannot know when an event is due, so</text>
  <text x="37" y="570.8" font-size="10.9" fill="#1f2328">the server pushes. The server must then track every</text>
  <text x="37" y="586.3" font-size="10.9" fill="#1f2328">in-flight delivery and defend itself against slow</text>
  <text x="37" y="601.8" font-size="10.9" fill="#1f2328">consumers. A Kafka-style pull keeps that state in the</text>
  <text x="37" y="617.3" font-size="10.9" fill="#1f2328">client, but cannot fire a timer.</text>
  <rect x="348" y="510" width="304" height="134" rx="8" fill="#fffbe8" stroke="#d9bf50" stroke-width="1.2"/>
  <text x="361" y="533" font-size="12.5" fill="#4d3f00" font-weight="700">At-least-once</text>
  <text x="361" y="555.4" font-size="10.9" fill="#1f2328">A delivery repeats until it is acknowledged. After a</text>
  <text x="361" y="570.8" font-size="10.9" fill="#1f2328">crash or an ack timeout a consumer can see the same</text>
  <text x="361" y="586.3" font-size="10.9" fill="#1f2328">event again, possibly out of order. Exactly-once is not</text>
  <text x="361" y="601.8" font-size="10.9" fill="#1f2328">offered: make the consumer idempotent, with</text>
  <text x="361" y="617.3" font-size="10.9" fill="#1f2328">message_id as the key.</text>
  <rect x="672" y="510" width="304" height="134" rx="8" fill="#fffbe8" stroke="#d9bf50" stroke-width="1.2"/>
  <text x="685" y="533" font-size="12.5" fill="#4d3f00" font-weight="700">Why a dead-letter queue?</text>
  <text x="685" y="555.4" font-size="10.9" fill="#1f2328">An event that no consumer can process would be</text>
  <text x="685" y="570.8" font-size="10.9" fill="#1f2328">retried forever and hold the floor back, which also</text>
  <text x="685" y="586.3" font-size="10.9" fill="#1f2328">blocks log cleanup. Parking it in an append-only file</text>
  <text x="685" y="601.8" font-size="10.9" fill="#1f2328">lets the group move on and keeps the evidence for</text>
  <text x="685" y="617.3" font-size="10.9" fill="#1f2328">inspection or replay.</text>
</svg>
