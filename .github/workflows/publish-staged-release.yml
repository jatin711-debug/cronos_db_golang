name: publish-staged-release

# Finalize an already tested, locally published image without rebuilding it.
# GITHUB_TOKEN publication does not recursively trigger release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag whose draft artifacts and Docker tags are ready
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-staged-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Require the tagged source on main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Download publication evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir receipt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > receipt/release.json
          gh release download "$TAG" --dir receipt --pattern SHA256SUMS \
            --pattern IMAGE_ID --pattern IMAGE_DIGEST --pattern IMAGE_ARCHIVE_SHA256 \
            --pattern release-image-scan.json --pattern LOCAL_PUBLICATION_EVIDENCE.json
      - name: Verify staging and the published Docker tags
        run: python scripts/verify-staged-publication.py --directory receipt --tag "$TAG" --source "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - name: Publish the verified release as latest
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(python -c 'import json; print(json.load(open("receipt/release.json"))["id"])')
          printf '{"draft":false,"make_latest":"true"}\n' > receipt/finalize.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method PATCH \
            --input receipt/finalize.json --jq '{tag_name,draft,html_url}'
