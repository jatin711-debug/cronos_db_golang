name: nightly-acceptance

# Every night, on the default branch: the acceptance tests several times over.
# A fault that shows once in a few runs is not found by the one run a change
# gets, and the faults these tests make are of that kind. With them run a
# rolling upgrade from the last release and back, and power cuts on LazyFS.
# It also runs on request, for any branch:
#   gh workflow run nightly.yml --ref <branch>
#
# With catchup_ab it runs only the catch-up comparison instead: the soak's
# "consumer group behind" disruption at 450 publishes per second, as in the
# v0.13.1 compressed soak, once with the baseline release's server and once
# with the branch's, on the same runner, and a table of how each did:
#   gh workflow run nightly.yml --ref <branch> -f catchup_ab=true
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: How many times each test runs
        required: false
        default: "3"
        type: string
      catchup_ab:
        description: Run only the catch-up comparison of the baseline release and this branch
        required: false
        default: false
        type: boolean
      baseline:
        description: Tag of the release to compare with (catchup_ab)
        required: false
        default: v0.13.1
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three server processes: killed, frozen, restarted, restored from backups,
  # flooded, and restarted with a backlog larger than their memory.
  processes:
    if: ${{ !inputs.catchup_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CGO_ENABLED: "1"
      LD_LIBRARY_PATH: ${{ github.workspace }}/internal/dedup/rust/target/release
      CRONOS_ACCEPTANCE_ARTIFACTS: ${{ github.workspace }}/build/acceptance-logs
      COUNT: ${{ inputs.count || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: cargo build --release --locked --manifest-path internal/dedup/rust/Cargo.toml
      - name: Acceptance tests on three processes, several times
        run: go test -tags acceptance -count="$COUNT" -timeout 110m -v ./tests/acceptance/
      - name: Keep the node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-process-node-logs
          path: build/acceptance-logs
          retention-days: 14
          if-no-files-found: ignore

  # Three containers of the image: links cut between them, and a memory limit
  # that the kernel enforces.
  containers:
    if: ${{ !inputs.catchup_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRONOS_IMAGE: cronos-db:nightly
      CRONOS_ACCEPTANCE_ARTIFACTS: ${{ github.workspace }}/build/container-logs
      COUNT: ${{ inputs.count || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the image
        run: docker build --pull --no-cache-filter runtime -t cronos-db:nightly .
      - name: Acceptance tests on three containers, several times
        run: go test -tags acceptance -count="$COUNT" -timeout 110m -v -run 'TestNetworkPartitions|TestRestartInContainers' ./tests/acceptance/
      - name: Keep the node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-container-node-logs
          path: build/container-logs
          retention-days: 14
          if-no-files-found: ignore

  # A rolling upgrade from the last release to this commit, a rollback to it
  # on data this commit has written, and an upgrade again, under load.
  upgrade:
    if: ${{ !inputs.catchup_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
      CRONOS_ACCEPTANCE_ARTIFACTS: ${{ github.workspace }}/build/upgrade-logs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build this commit's server and the last release's
        run: |
          set -euo pipefail
          baseline="${{ inputs.baseline }}"
          if [ -z "$baseline" ]; then baseline=$(git describe --tags --abbrev=0 --match 'v*' HEAD^); fi
          echo "upgrading from $baseline"
          mkdir -p build/upgrade
          go build -o build/upgrade/cronos-api ./cmd/api
          git worktree add "$RUNNER_TEMP/baseline" "$baseline"
          (cd "$RUNNER_TEMP/baseline" && go build -o "$GITHUB_WORKSPACE/build/upgrade/cronos-api-baseline" ./cmd/api)
      - name: Rolling upgrade and rollback
        env:
          CRONOS_BINARY: ${{ github.workspace }}/build/upgrade/cronos-api
          CRONOS_UPGRADE_FROM_BINARY: ${{ github.workspace }}/build/upgrade/cronos-api-baseline
        run: go test -tags acceptance -count=1 -timeout 50m -v -run '^TestRollingUpgradeAndRollback$' ./tests/acceptance/
      - name: Keep the node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-upgrade-node-logs
          path: build/upgrade-logs
          retention-days: 14
          if-no-files-found: ignore

  # Power cuts: each node's data on LazyFS, which drops what was not synced
  # (docs/FAULT_TESTING.md), with both durable fsync modes.
  power-loss:
    if: ${{ !inputs.catchup_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
      CRONOS_ACCEPTANCE_ARTIFACTS: ${{ github.workspace }}/build/power-loss-logs
      LAZYFS_COMMIT: 3edad01aa936b81fed9bd64e47e725fc5ef6c977
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build LazyFS
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends cmake g++ libfuse3-dev fuse3
          git clone --quiet https://github.com/dsrhaslab/lazyfs.git "$RUNNER_TEMP/lazyfs"
          git -C "$RUNNER_TEMP/lazyfs" checkout --quiet "$LAZYFS_COMMIT"
          (cd "$RUNNER_TEMP/lazyfs/libs/libpcache" && ./build.sh > /dev/null)
          (cd "$RUNNER_TEMP/lazyfs/lazyfs" && ./build.sh > /dev/null)
          ls -l /dev/fuse "$RUNNER_TEMP/lazyfs/lazyfs/build/lazyfs"
      - name: Power cuts with every_event and batch fsync
        env:
          CRONOS_LAZYFS_BIN: ${{ runner.temp }}/lazyfs/lazyfs/build/lazyfs
          LD_LIBRARY_PATH: ${{ runner.temp }}/lazyfs/libs/libpcache/build
        run: |
          set -euo pipefail
          for mode in every_event batch; do
            CRONOS_POWERLOSS_FSYNC=$mode go test -tags acceptance -count=1 -timeout 25m -v -run '^TestPowerLoss$' ./tests/acceptance/
          done
      - name: Keep the node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-power-loss-node-logs
          path: build/power-loss-logs
          retention-days: 14
          if-no-files-found: ignore

  # The soak's remote mode (CRONOS_SOAK_REMOTE), against three nodes that
  # scripts/soak/local-remote-node.sh runs as processes of this runner: a
  # short, light run of the disruptions that act on nodes by command (lost,
  # frozen, replaced), so that the driver for a soak on separate hosts keeps
  # working.
  remote-soak:
    if: ${{ !inputs.catchup_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
      CRONOS_REMOTE_ROOT: ${{ github.workspace }}/build/remote-soak
      CRONOS_ACCEPTANCE_ARTIFACTS: ${{ github.workspace }}/build/remote-soak-logs
      CRONOS_SOAK_DURATION: 20m
      CRONOS_SOAK_WARMUP: 3m
      CRONOS_SOAK_WINDOW: 2m
      CRONOS_SOAK_ONLY: "1,2,6"
      CRONOS_SOAK_RATE: "50"
      CRONOS_SOAK_BURST_RATE: "50"
      CRONOS_SOAK_SEED: "2000"
      CRONOS_SOAK_SAMPLE: 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Three stand-in hosts
        run: |
          set -euo pipefail
          go build -o build/cronos-api ./cmd/api
          bash scripts/soak/local-remote-node.sh setup build/cronos-api
      - name: Soak driving them by command
        env:
          CRONOS_SOAK_REMOTE: ${{ github.workspace }}/build/remote-soak/remote.json
        run: go test -tags acceptance -count=1 -timeout 50m -v -run '^TestSoak$' ./tests/acceptance/
      - name: Stop the nodes
        if: always()
        run: for n in node1 node2 node3; do bash scripts/soak/local-remote-node.sh kill $n || true; done
      - name: Keep the node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-remote-soak-logs
          path: |
            build/remote-soak-logs
            build/remote-soak/node*/log
          retention-days: 14
          if-no-files-found: ignore

  # The catch-up comparison (catchup_ab). Both legs run on this one runner,
  # one after the other, with the soak's settings of the compressed run:
  # 450 publishes per second, 8 MiB segments, nodes of 2 CPUs and 384 MiB,
  # 100,000 delayed events seeded, and a slow group stopped for 14 minutes
  # after 30 minutes of warm-up. A leg that fails still leaves its report.
  catchup-ab:
    if: ${{ inputs.catchup_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CGO_ENABLED: "0"
      BASELINE: ${{ inputs.baseline || 'v0.13.1' }}
      AB: ${{ github.workspace }}/build/catchup-ab
      CRONOS_SOAK_DURATION: 70m
      CRONOS_SOAK_WARMUP: 30m
      CRONOS_SOAK_WINDOW: 14m
      CRONOS_SOAK_ONLY: "5"
      CRONOS_SOAK_RATE: "450"
      CRONOS_SOAK_BURST_RATE: "450"
      CRONOS_SOAK_SEGMENT_MIB: "8"
      CRONOS_SOAK_NODE_PROCS: "2"
      CRONOS_SOAK_NODE_MEMORY_MIB: "384"
      CRONOS_SOAK_SEED: "100000"
      CRONOS_SOAK_RECOVER_WITHIN: 45m
      CRONOS_SOAK_SAMPLE: 30s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build both servers and the soak
        run: |
          set -euo pipefail
          mkdir -p "$AB"
          go build -o "$AB/cronos-api-branch" ./cmd/api
          git worktree add "$RUNNER_TEMP/baseline" "$BASELINE"
          (cd "$RUNNER_TEMP/baseline" && go build -o "$AB/cronos-api-baseline" ./cmd/api)
          go test -c -tags acceptance -o "$AB/acceptance.test" ./tests/acceptance
          # The nodes' data goes on the runner's larger disk.
          sudo mkdir -p /mnt/catchup-ab && sudo chown "$(id -u):$(id -g)" /mnt/catchup-ab
          nproc; free -m; df -h / /mnt
      - name: Soak with the baseline server
        id: baseline
        continue-on-error: true
        working-directory: tests/acceptance
        env:
          TMPDIR: /mnt/catchup-ab
        run: |
          CRONOS_BINARY="$AB/cronos-api-baseline" CRONOS_SOAK_OUT="$AB/baseline-report" \
          CRONOS_ACCEPTANCE_ARTIFACTS="$AB/baseline-logs" \
            "$AB/acceptance.test" -test.run '^TestSoak$' -test.v -test.timeout 150m 2>&1 | tee "$AB/baseline.log"
      - name: Soak with the branch's server
        id: branch
        continue-on-error: true
        working-directory: tests/acceptance
        env:
          TMPDIR: /mnt/catchup-ab
        run: |
          CRONOS_BINARY="$AB/cronos-api-branch" CRONOS_SOAK_OUT="$AB/branch-report" \
          CRONOS_ACCEPTANCE_ARTIFACTS="$AB/branch-logs" \
            "$AB/acceptance.test" -test.run '^TestSoak$' -test.v -test.timeout 150m 2>&1 | tee "$AB/branch.log"
      - name: Compare
        if: always()
        run: |
          {
            echo "## Catch-up: $BASELINE against ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))"
            echo
            echo "Soak legs: baseline ${{ steps.baseline.outcome }}, branch ${{ steps.branch.outcome }}."
            echo
            python3 scripts/soak/catchup-summary.py "$BASELINE=$AB/baseline-report/workload.csv" "branch=$AB/branch-report/workload.csv"
            echo
            for leg in baseline branch; do
              echo "**$leg:**"
              echo '```'
              grep -E 'disruption consumer group behind|^--- |FAIL|lost|early' "$AB/$leg.log" | head -20 || true
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catchup-ab
          path: |
            build/catchup-ab/*-report
            build/catchup-ab/*-logs
            build/catchup-ab/*.log
          retention-days: 14
          if-no-files-found: warn
