replicaCount: 3

image:
  repository: johnny711dock/cronos-db
  pullPolicy: IfNotPresent
  # tag defaults to .Chart.AppVersion when empty.
  tag: ""
  # Optional image digest; when set, it takes precedence over tag.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
terminationGracePeriodSeconds: 75
startupProbe:
  periodSeconds: 5
  failureThreshold: 60

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

nodeSelector: {}

tolerations: []

affinity: {}

podDisruptionBudget:
  enabled: true

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

# A separate per-pod PVC keeps backups when the data PVC is lost. Choose a
# storage class on a separate failure domain; retain these claims during restore.
backupPersistence:
  enabled: false
  mountPath: /backups
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi

service:
  type: ClusterIP
  grpcPort: 9000
  httpPort: 8080
  # Give clients each pod's address, <pod>.<headless-service>.<namespace>.svc
  # on grpcPort, in partition metadata, so that clients inside the cluster
  # reach the leaders they were not configured with, pods added later
  # included. With TLS on, the certificate has to cover those names.
  advertisePodAddress: false

headlessService:
  gossipPort: 7946
  clusterGRPCPort: 7947
  raftPort: 7948

config:
  # Default to developer mode for easy local/CI installs. Production must set
  # dev=false and provide TLS, auth, and encryption-at-rest configuration.
  dev: true
  nodeIdPrefix: "cronos-node"
  dataDir: /data
  partitionCount: 8
  replicationFactor: 3
  minInSyncReplicas: 1
  fsyncMode: every_event
  segmentSizeBytes: 536870912
  indexInterval: 1000
  flushIntervalMs: 100
  tickMs: 100
  wheelSize: 60
  # Dedup TTL: 24h is too aggressive for production backfill; 168h = 7 days.
  dedupTTLHours: 168
  bloomCapacity: 1000000
  exactlyOnceCommits: false
  tracingEnabled: false
  tracingExporter: otlp
  tracingOTLPEndpoint: ""
  tracingSampleRatio: 0.01
  tracingInsecure: true

# Enable only when TLS certificates are provided via secrets.
tls:
  enabled: false
  caCertEnabled: false
  # http serves the HTTP port (health, metrics, the admin API and the
  # dashboard) over TLS as well, with the same certificate. The probes then
  # use HTTPS. Leave it off when TLS is ended in front of the pods for that
  # port. It needs tls.enabled.
  http: false
  # existingSecret: cronos-db-tls

# Enable only when an authentication secret is provided.
auth:
  enabled: false
  policyKey: policy.json
  # existingSecret: cronos-db-auth
  # secretKey: jwt-secret

# Enable only when an encryption key secret is provided.
encryption:
  enabled: false
  secretKey: master.key
  # existingSecret: cronos-db-encryption
  # secretKey: master.key

# Mutual TLS for all traffic between nodes: replication, membership and Raft.
# Enable only when the certificates are provided via a secret with the keys
# tls.crt, tls.key and ca.crt. The certificate must be valid for the names the
# nodes reach each other by (*.<release>-cronos-db-headless.<namespace>.svc).
replicationTLS:
  enabled: false
  # existingSecret: cronos-db-replication-tls

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    # tlsConfig is how Prometheus verifies the pods when tls.http is on. As
    # it stands the certificate is not verified; name the CA and the server
    # name here to have it verified.
    tlsConfig:
      insecureSkipVerify: true

alerts:
  enabled: false
  # Warn when the 99th percentile of delivery lateness, the time between an
  # event's scheduled time and its first delivery to a consumer, stays above
  # this many seconds.
  deliveryLatenessSeconds: 30
