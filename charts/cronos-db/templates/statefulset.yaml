apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cronos-db.fullname" . }}
  labels:
    {{- include "cronos-db.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cronos-db.headlessServiceName" . }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cronos-db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cronos-db.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cronos-db.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if .Values.encryption.enabled }}
      initContainers:
        - name: prepare-encryption-key
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - umask 077; cp /key-source/master.key /key-private/master.key; chmod 600 /key-private/master.key
          volumeMounts:
            - name: encryption-source
              mountPath: /key-source
              readOnly: true
            - name: encryption
              mountPath: /key-private
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # Only ordinal zero bootstraps a fresh Raft cluster. Existing
              # Raft state is reused on restart by the application.
              if [ "${POD_NAME##*-}" = "0" ]; then
                exec /app/cronos-api --cluster-seeds=
              fi
              exec /app/cronos-api
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CRONOS_NODE_ID
              value: "$(POD_NAME)"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CRONOS_CLUSTER_GOSSIP_ADDR
              value: "$(POD_NAME).{{ include "cronos-db.headlessServiceName" . }}.$(POD_NAMESPACE).svc:{{ .Values.headlessService.gossipPort }}"
            - name: CRONOS_CLUSTER_GRPC_ADDR
              value: "$(POD_NAME).{{ include "cronos-db.headlessServiceName" . }}.$(POD_NAMESPACE).svc:{{ .Values.headlessService.clusterGRPCPort }}"
            - name: CRONOS_CLUSTER_RAFT_ADDR
              value: "$(POD_NAME).{{ include "cronos-db.headlessServiceName" . }}.$(POD_NAMESPACE).svc:{{ .Values.headlessService.raftPort }}"
            {{- if .Values.tls.enabled }}
            - name: CRONOS_TLS_ENABLED
              value: "true"
            - name: CRONOS_TLS_CERT_FILE
              value: "/etc/cronos/tls/tls.crt"
            - name: CRONOS_TLS_KEY_FILE
              value: "/etc/cronos/tls/tls.key"
            {{- if .Values.tls.caCertEnabled }}
            - name: CRONOS_TLS_CA_FILE
              value: "/etc/cronos/tls/ca.crt"
            {{- end }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: CRONOS_AUTH_ENABLED
              value: "true"
            - name: CRONOS_AUTH_POLICY_FILE
              value: "/etc/cronos/auth/{{ .Values.auth.policyKey }}"
            - name: CRONOS_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth" (include "cronos-db.fullname" .)) .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey | default "jwt-secret" }}
            {{- end }}
            {{- if .Values.encryption.enabled }}
            - name: CRONOS_ENCRYPTION_ENABLED
              value: "true"
            - name: CRONOS_ENCRYPTION_KEY_FILE
              value: "/etc/cronos/encryption/master.key"
            {{- end }}
            {{- if .Values.replicationTLS.enabled }}
            - name: CRONOS_REPLICATION_TLS_ENABLED
              value: "true"
            - name: CRONOS_REPLICATION_TLS_CERT_FILE
              value: "/etc/cronos/replication-tls/tls.crt"
            - name: CRONOS_REPLICATION_TLS_KEY_FILE
              value: "/etc/cronos/replication-tls/tls.key"
            {{- if .Values.replicationTLS.caCertEnabled }}
            - name: CRONOS_REPLICATION_TLS_CA_FILE
              value: "/etc/cronos/replication-tls/ca.crt"
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "cronos-db.fullname" . }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: gossip
              containerPort: {{ .Values.headlessService.gossipPort }}
              protocol: TCP
            - name: cluster-grpc
              containerPort: {{ .Values.headlessService.clusterGRPCPort }}
              protocol: TCP
            - name: raft
              containerPort: {{ .Values.headlessService.raftPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/cronos/tls
              readOnly: true
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: auth
              mountPath: /etc/cronos/auth
              readOnly: true
            {{- end }}
            {{- if .Values.encryption.enabled }}
            - name: encryption
              mountPath: /etc/cronos/encryption
              readOnly: true
            {{- end }}
            {{- if .Values.replicationTLS.enabled }}
            - name: replication-tls
              mountPath: /etc/cronos/replication-tls
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ default (printf "%s-tls" (include "cronos-db.fullname" .)) .Values.tls.existingSecret }}
        {{- end }}
        {{- if .Values.auth.enabled }}
        - name: auth
          secret:
            secretName: {{ default (printf "%s-auth" (include "cronos-db.fullname" .)) .Values.auth.existingSecret }}
        {{- end }}
        {{- if .Values.encryption.enabled }}
        - name: encryption
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: encryption-source
          secret:
            secretName: {{ default (printf "%s-encryption" (include "cronos-db.fullname" .)) .Values.encryption.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.encryption.secretKey }}
                path: master.key
        {{- end }}
        {{- if .Values.replicationTLS.enabled }}
        - name: replication-tls
          secret:
            secretName: {{ default (printf "%s-replication-tls" (include "cronos-db.fullname" .)) .Values.replicationTLS.existingSecret }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
