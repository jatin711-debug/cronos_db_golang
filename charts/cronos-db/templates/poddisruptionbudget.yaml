{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cronos-db.fullname" . }}
  labels:
    {{- include "cronos-db.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cronos-db.selectorLabels" . | nindent 6 }}
  # Every pod is a Raft voter and holds replicas of partitions, and a budget
  # counts pods, not either of those. It used to keep floor(RF/2) + 1 pods,
  # which let a drain take 3 of 5 pods at once: a majority of the voters, or
  # every replica of a partition. One at a time keeps both, given
  # --min-insync-replicas below the replication factor.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
{{- end }}
